# Publication de l'installateur Windows (NSIS) à chaque tag `v*`.
#
# Le provider de publication est configuré dans electron-builder.yml
# (provider: github → raj-lab-alt/design-felicite-ai). Ce workflow construit
# l'installateur + `latest.yml` (canal electron-updater) puis téléverse les
# artefacts sur la Release GitHub. L'app installée les récupère via
# « Vérifier les mises à jour ».
#
# IMPORTANT : bumper `version` dans package.json avant de pousser le tag
# (ex. `npm version patch`), sinon l'updater ignore la release.
#
# Signature de code : renseigner les secrets CSC_LINK/CSC_KEY_PASSWORD
# (certificat signé) ou configurer Azure Trusted Signing.
# Sans certificat, l'installateur est produit non signé.

name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Build + empaquetage NSIS (sans publication auto)
        run: npm run dist:ci
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Téléversement vers GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/design-felicite-ai-*.exe
            release/design-felicite-ai-*.blockmap
            release/latest.yml
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: false