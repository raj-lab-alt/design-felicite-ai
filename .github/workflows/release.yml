# Publication de l'installateur Windows (NSIS) à chaque tag `v*`.
#
# Prérequis pour servir le canal `electron-updater` :
#   1. Définir un provider de publication dans electron-builder.yml
#      (ex. `provider: gitHub` avec `owner`/`repo`, ou `provider: generic`
#      avec une URL https). Le workflow ci-dessous téléverse alors aussi
#      `latest.yml`/`latest-mac.yml` qui alimente l'auto-update.
#   2. Signature de code : renseigner les secrets CSC_LINK/CSC_KEY_PASSWORD
#      (certificat signé) ou configurer Azure Trusted Signing.
#      Sans certificat, l'installateur est produit non signé.

name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Build + empaquetage NSIS
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Téléversement vers GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Design Félicité AI-*.exe
            release/Design Félicité AI-*.blockmap
            release/latest.yml
          generate_release_notes: true
          fail_on_unmatched_files: false