appId: ai.designfelicite.desktop
productName: Design Félicité AI
copyright: Copyright © 2026 Design Félicité AI

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - '!**/*.{map,ts,md}'
  - package.json

extraResources:
  - from: resources/protocol
    to: protocol

asar: true
npmRebuild: false

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Design Félicité AI
  uninstallDisplayName: Design Félicité AI
  deleteAppDataOnUninstall: false
  installerLanguages:
    - fr_FR
    - en_US
  language: 1036

publish: null