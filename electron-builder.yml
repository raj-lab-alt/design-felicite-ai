appId: ai.designfelicite.desktop
productName: Design Félicité AI
copyright: Copyright © 2026 Design Félicité AI

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - '!**/*.{map,ts,md}'
  - package.json

extraResources:
  - from: resources/protocol
    to: protocol

asar: true
npmRebuild: false

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${name}-${version}-setup.${ext}
  signtoolOptions:
    signingHashAlgorithms:
      - sha256

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Design Félicité AI
  uninstallDisplayName: Design Félicité AI
  deleteAppDataOnUninstall: false
  installerLanguages:
    - fr_FR
    - en_US
  language: 1036

# Canal de mise à jour (electron-updater) — GitHub Releases.
#  - electron-builder embarque `resources/app-update.yml` (feed de l'app) et
#    génère `latest.yml` (+ blockmap) à chaque build.
#  - Publication : tag `vX.Y.Z` → workflow `release.yml` téléverse les artefacts
#    sur la Release GitHub ; l'app installée les récupère via « Vérifier les mises à jour ».
#  - IMPORTANT : bumper `version` dans package.json avant chaque publication
#    (l'updater n'installe qu'une version strictement supérieure).
#  - Le dépôt GitHub doit être public (sinon l'app exigerait un jeton embarqué, interdit).
publish:
  provider: github
  owner: raj-lab-alt
  repo: design-felicite-ai
  releaseType: release
